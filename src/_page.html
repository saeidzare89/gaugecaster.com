<html lang="en">
<head>

<meta name="theme-color" content="#1F1C1A" media="(prefers-color-scheme: dark)">

<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://www.gaugecaster.com/img/icon-512.png">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="preload" href="/fonts/Fredoka-Medium.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/style.css">
<script>document.documentElement.classList.add('js');</script>

<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="/" aria-label="GaugeCaster, home">
      <img src="/img/mark-96.png" width="36" height="36" alt="">
      <span class="word"><b>Gauge</b>caster</span>

    <nav class="nav">
      <a href="/" data-nav="home">Home</a>
      <a href="/support.html" data-nav="support">Support</a>
    </nav>

</header>

{{BODY}}
</main>

    <nav>
      <a href="/privacy.html" data-nav="privacy">Privacy</a>
      <a href="/terms.html" data-nav="terms">Terms</a>
      <a href="/support.html">help@gaugecaster.com</a>
    </nav>
  </div>
</footer>
<script>
(() => {
  const items = document.querySelectorAll('.reveal');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still || !('IntersectionObserver' in window)) { items.forEach(e => e.classList.add('in')); return; }
  const seen = new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); seen.unobserve(e.target); }
  }), { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
  items.forEach(e => seen.observe(e));
  document.querySelectorAll('.meter rect').forEach((r, i) => r.style.setProperty('--i', i));
})();
</script>
</body>
</html>
